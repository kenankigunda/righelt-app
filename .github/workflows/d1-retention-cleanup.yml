name: D1 Retention Cleanup
run-name: D1 retention cleanup (${{ inputs.retention_hours }}h)

on:
  workflow_dispatch:
    inputs:
      retention_hours:
        description: "Delete live-game data with latest activity older than this many hours"
        required: true
        type: string

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DB_NAME: ${{ vars.CLOUDFLARE_D1_DB_NAME }}
      D1_RETENTION_HOURS: ${{ inputs.retention_hours }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Preflight configuration check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required variable: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$D1_RETENTION_HOURS" ]; then
            echo "Missing required env var: D1_RETENTION_HOURS"
            exit 1
          fi
          if ! printf '%s' "$D1_RETENTION_HOURS" | grep -Eq '^[1-9][0-9]*$'; then
            echo "D1_RETENTION_HOURS must be a positive integer"
            exit 1
          fi
          echo "Running D1 retention cleanup for data older than ${D1_RETENTION_HOURS} hours"
          echo "Target D1 database: ${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}"

      - name: Build SQL files for this run
        run: |
          REPORT_SQL_PATH="$RUNNER_TEMP/d1-retention-report.sql"
          CLEANUP_SQL_PATH="$RUNNER_TEMP/d1-retention-cleanup.sql"

          cat > "$REPORT_SQL_PATH" <<EOF
          SELECT 'live_games' AS table_name, COUNT(*) AS stale_row_count
          FROM live_games
          WHERE latest_activity_at < datetime('now', '-${D1_RETENTION_HOURS} hours')
          UNION ALL
          SELECT 'live_events' AS table_name, COUNT(*) AS stale_row_count
          FROM live_events
          WHERE game_id IN (
            SELECT game_id
            FROM live_games
            WHERE latest_activity_at < datetime('now', '-${D1_RETENTION_HOURS} hours')
          )
          UNION ALL
          SELECT 'live_participants' AS table_name, COUNT(*) AS stale_row_count
          FROM live_participants
          WHERE game_id IN (
            SELECT game_id
            FROM live_games
            WHERE latest_activity_at < datetime('now', '-${D1_RETENTION_HOURS} hours')
          )
          UNION ALL
          SELECT 'live_join_requests' AS table_name, COUNT(*) AS stale_row_count
          FROM live_join_requests
          WHERE game_id IN (
            SELECT game_id
            FROM live_games
            WHERE latest_activity_at < datetime('now', '-${D1_RETENTION_HOURS} hours')
          )
          UNION ALL
          SELECT 'live_invites' AS table_name, COUNT(*) AS stale_row_count
          FROM live_invites
          WHERE game_id IN (
            SELECT game_id
            FROM live_games
            WHERE latest_activity_at < datetime('now', '-${D1_RETENTION_HOURS} hours')
          );
          EOF

          sed "s/?1/${D1_RETENTION_HOURS}/g" db/ops/cleanup-live-data.sql > "$CLEANUP_SQL_PATH"

          {
            echo "REPORT_SQL_PATH=$REPORT_SQL_PATH"
            echo "CLEANUP_SQL_PATH=$CLEANUP_SQL_PATH"
          } >> "$GITHUB_ENV"

      - name: Report stale row counts before cleanup
        run: |
          pnpm --dir apps/api exec wrangler d1 execute "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" \
            --config wrangler.toml \
            --remote \
            --file "$REPORT_SQL_PATH"

      - name: Delete stale live-game data
        run: |
          pnpm --dir apps/api exec wrangler d1 execute "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" \
            --config wrangler.toml \
            --remote \
            --file "$CLEANUP_SQL_PATH"

      - name: Report stale row counts after cleanup
        run: |
          pnpm --dir apps/api exec wrangler d1 execute "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" \
            --config wrangler.toml \
            --remote \
            --file "$REPORT_SQL_PATH"
