              "shard": 1,
              "shards": 1,
              "artifact": "node-6"
            },
            {
              "suite": "web-integration",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-7"
            },
            {
              "suite": "sync-stress",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-8"
            },
            {
              "suite": "sync-runtime",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-9"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v5",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Setup pnpm",
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "9.15.9"
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": "22",
            "cache": "pnpm"
          }
        },
        {
          "name": "Install dependencies",
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Record advisory selection",
          "run": "pnpm test:plan --base origin/main"
        },
        {
          "name": "Validate suite",
          "env": {
            "SUITE": "${{ matrix.suite }}",
            "PROJECT": "${{ matrix.project }}",
            "SHARD": "${{ matrix.shard }}",
            "SHARDS": "${{ matrix.shards }}"
          },
          "run": "node scripts/testing/ci-run.mjs"
        },
        {
          "name": "Preserve evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "suite-${{ matrix.artifact }}-${{ github.run_attempt }}",
            "path": "test-results/",
            "if-no-files-found": "error"
