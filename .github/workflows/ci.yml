              "shards": 1,
              "artifact": "node-2"
            },
            {
              "suite": "web-unit",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-3"
            },
            {
              "suite": "engine-integration",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-4"
            },
            {
              "suite": "api-handler",
