name: CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/api-handler/**"
      - "packages/game-engine/**"
      - "packages/shared-types/**"
      - "db/migrations/**"
      - "db/ops/**"
      - "e2e/**"
      - "package.json"
      - "playwright.config.mjs"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/db-retention-cleanup.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/api-handler/**"
      - "packages/game-engine/**"
      - "packages/shared-types/**"
      - "db/migrations/**"
      - "db/ops/**"
      - "e2e/**"
      - "package.json"
      - "playwright.config.mjs"
      - "pnpm-workspace.yaml"
      - "scripts/**"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/db-retention-cleanup.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Generated web runtime is up to date
        run: pnpm check:web-engine-generated

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke tests
        run: pnpm test:e2e:smoke

      - name: E2E workflow tests
        run: pnpm test:e2e
