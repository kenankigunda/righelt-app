          "name": "Preserve full inventory",
          "if": "always()",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "full-validation-${{ github.run_attempt }}",
            "path": "test-results/full/full.json",
            "if-no-files-found": "error"
          }
        }
