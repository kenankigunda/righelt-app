        "auth-smoke-chromium-1",
        "auth-smoke-chromium-1-retry"
      ],
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v5",
          "with": {
            "fetch-depth": 0,
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}"
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": "22.23.4"
          }
        },
        {
          "name": "Select exact-run evidence",
          "id": "artifacts",
          "uses": "actions/github-script@v8",
          "with": {
            "script": "const {selectSuiteArtifacts}=await import(process.env.GITHUB_WORKSPACE+'/scripts/testing/select-artifacts.mjs');\nconst {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:context.runId});\nconst artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:context.runId,per_page:100});\nconst selected=selectSuiteArtifacts(artifacts,{runId:context.runId,headSha:run.head_sha,runAttempt:run.run_attempt});\nif(!selected.length)throw new Error('No suite evidence');\ncore.setOutput('ids',selected.map(a=>a.id).join(','));"
          }
        },
        {
          "name": "Download suite evidence",
          "uses": "actions/download-artifact@v5",
          "with": {
            "artifact-ids": "${{ steps.artifacts.outputs.ids }}",
            "path": "test-results/full",
            "merge-multiple": true
