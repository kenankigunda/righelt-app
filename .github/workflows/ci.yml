{
  "name": "CI",
  "on": {
    "pull_request": {
      "types": [
        "opened",
        "synchronize",
        "reopened"
      ]
    },
    "push": {
      "branches": [
        "main"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "ci-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": "${{ github.event_name == 'pull_request' }}"
  },
  "env": {
    "FORCE_JAVASCRIPT_ACTIONS_TO_NODE24": "true",
    "RIGHELT_TEST_BASE_REVISION": "${{ github.event.pull_request.base.sha || github.sha }}"
  },
  "jobs": {
    "plan": {
      "name": "Advisory affected-test plan",
      "runs-on": "ubuntu-latest",
      "continue-on-error": true,
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v5",
          "with": {
            "fetch-depth": 0,
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}"
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": "22.23.4"
          }
        },
        {
          "name": "Record shadow selection",
          "run": "node scripts/testing/cli.mjs plan --base \"$RIGHELT_TEST_BASE_REVISION\" --out test-results/plan/plan.json"
        },
        {
          "name": "Preserve shadow plan",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "affected-plan-${{ github.run_attempt }}",
            "path": "test-results/plan/plan.json",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "node": {
      "name": "node / ${{ matrix.suite }}",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 60,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "suite": "typecheck",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-0"
            },
            {
              "suite": "generated",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-1"
            },
            {
              "suite": "engine-unit",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-2"
            },
            {
              "suite": "web-unit",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-3"
            },
            {
              "suite": "computer-unit",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-4"
            },
            {
              "suite": "computer-integration",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-5"
            },
            {
              "suite": "engine-integration",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-6"
            },
            {
              "suite": "api-handler",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-7"
            },
            {
              "suite": "api-worker",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-8"
            },
            {
              "suite": "web-integration",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-9"
            },
            {
              "suite": "sync-stress",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-10"
            },
            {
              "suite": "sync-runtime",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-11"
            },
            {
              "suite": "tooling",
              "project": "",
              "shard": 1,
              "shards": 1,
              "artifact": "node-12"
            }
          ]
        }
      },
      "steps": [
        {
          "name": "Checkout",
          "uses": "actions/checkout@v5",
          "with": {
            "fetch-depth": 0,
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}"
          }
        },
        {
          "name": "Setup pnpm",
          "uses": "pnpm/action-setup@v4",
          "with": {
            "version": "9.15.9"
          }
        },
        {
          "name": "Setup Node",
          "uses": "actions/setup-node@v5",
          "with": {
            "node-version": "22.23.4",
            "cache": "pnpm"
          }
        },
        {
          "name": "Install dependencies",
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Validate suite",
          "env": {
            "SUITE": "${{ matrix.suite }}",
            "PROJECT": "${{ matrix.project }}",
            "SHARD": "${{ matrix.shard }}",
            "SHARDS": "${{ matrix.shards }}",
            "RIGHELT_EVIDENCE_PROFILE": "pr-gate",
            "RIGHELT_CI_ATTEMPT": "1"
          },
          "run": "node scripts/testing/ci-run.mjs"
        },
        {
          "name": "Preserve evidence",
          "if": "always()",
          "uses": "actions/upload-artifact@v6",
          "with": {
            "name": "suite-${{ matrix.artifact }}-attempt-1-${{ github.run_attempt }}",
            "path": "test-results/",
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "tooling-browser-default-1": {
      "name": "tooling-browser / chromium / attempt 1",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 60,
      "outputs": {
        "retry_eligible": "${{ steps.validate.outputs.retry_eligible }}",
        "receipt_digest": "${{ steps.validate.outputs.receipt_digest }}"
      },
      "steps": [
