    "pr-validation": {
      "permissions": {
        "contents": "read",
        "actions": "read"
      },
      "name": "PR validation",
      "if": "always()",
      "runs-on": "ubuntu-latest",
      "needs": [
        "node",
        "tooling-browser-default-1",
        "tooling-browser-default-1-retry",
        "browser-contract-chromium-1",
        "browser-contract-chromium-1-retry",
