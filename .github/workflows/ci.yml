name: CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/api-handler/**"
      - "packages/game-engine/**"
      - "packages/shared-types/**"
      - "db/migrations/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/api-handler/**"
      - "packages/game-engine/**"
      - "packages/shared-types/**"
      - "db/migrations/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck
        run: pnpm typecheck

      - name: Engine tests
        run: pnpm test:engine

      - name: API handler tests
        run: pnpm test:api-handler
