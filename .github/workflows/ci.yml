          "env": {
            "SUITE": "tooling-browser",
            "PROJECT": "",
            "SHARD": "1",
            "SHARDS": "1",
            "RIGHELT_EVIDENCE_PROFILE": "pr-gate",
            "RIGHELT_CI_ATTEMPT": "1",
            "RIGHELT_DEFER_INFRA_RETRY": "1"
