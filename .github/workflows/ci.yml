          }
        },
        {
          "name": "Install dependencies",
          "run": "pnpm install --frozen-lockfile"
        },
        {
          "name": "Select latest exact-run evidence",
          "id": "artifacts",
          "uses": "actions/github-script@v8",
          "with": {
            "script": "const {selectSuiteArtifacts}=await import(process.env.GITHUB_WORKSPACE+'/scripts/testing/select-artifacts.mjs');\nconst {data:run}=await github.rest.actions.getWorkflowRun({...context.repo,run_id:context.runId});\nconst artifacts=await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{...context.repo,run_id:context.runId,per_page:100});\nconst selected=selectSuiteArtifacts(artifacts,{runId:context.runId,headSha:run.head_sha});\nif(!selected.length)throw new Error('No suite evidence');\ncore.setOutput('ids',selected.map(a=>a.id).join(','));"
          }
        },
        {
          "name": "Download suite evidence",
          "uses": "actions/download-artifact@v5",
          "with": {
            "artifact-ids": "${{ steps.artifacts.outputs.ids }}",
            "path": "test-results/full",
            "merge-multiple": true
          }
        },
