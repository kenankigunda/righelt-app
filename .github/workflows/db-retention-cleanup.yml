name: DB Retention Cleanup
run-name: DB retention cleanup (${{ inputs.retention_hours }}h)

on:
  workflow_dispatch:
    inputs:
      retention_hours:
        description: "Delete live-game data with latest activity older than this many hours"
        required: true
        type: string

jobs:
  cleanup:
    # Retired by T-108: preserve legacy/account history; never bypass cutover triggers.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DB_NAME: ${{ vars.CLOUDFLARE_D1_DB_NAME }}
      DB_RETENTION_HOURS: ${{ inputs.retention_hours }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Prepare retention cleanup inputs
        run: |
          node scripts/db-retention-cleanup-github.mjs

      - name: Report stale row counts before cleanup
        run: |
          pnpm --dir apps/api exec wrangler d1 execute "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" \
            --config wrangler.toml \
            --remote \
            --file "$REPORT_SQL_PATH"

      - name: Delete stale live-game data
        run: |
          pnpm --dir apps/api exec wrangler d1 execute "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" \
            --config wrangler.toml \
            --remote \
            --file "$CLEANUP_SQL_PATH"

      - name: Report stale row counts after cleanup
        run: |
          pnpm --dir apps/api exec wrangler d1 execute "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" \
            --config wrangler.toml \
            --remote \
            --file "$REPORT_SQL_PATH"
