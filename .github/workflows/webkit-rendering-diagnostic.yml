name: WebKit worker lifecycle diagnostic
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Run the separately reviewed e497 full WK1 lifecycle diagnostic"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    if: inputs.execute == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic source at the explicitly dispatched branch
        uses: actions/checkout@v5
        with:
          path: diagnostic
          persist-credentials: false
      - name: Checkout the unchanged product candidate separately
        uses: actions/checkout@v5
        with:
          ref: e4979ad6e9d57e69753b0fe0788b636882e6c368
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the released resource supervisor
        uses: actions/checkout@v5
        with:
          ref: 0c7b51b64c26604f1e08939e827cb4a934aa4f93
          path: tools
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
      - name: Install the original candidate dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Install the original pinned WebKit browser and Linux dependencies
        working-directory: candidate
        env:
          PROJECT: webkit
        run: node scripts/testing/install-browsers.mjs
      - name: Record the explicit diagnostic dispatch authority
        env:
          DIAGNOSTIC_ACTOR: ${{ github.actor }}
          DIAGNOSTIC_RUN: ${{ github.run_id }}
          DIAGNOSTIC_ATTEMPT: ${{ github.run_attempt }}
          DIAGNOSTIC_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const file='diagnostic/scripts/diagnostics/pr250-worker-lifecycle/source-freeze.json';
          fs.writeFileSync('root-diagnostic-grant.json',JSON.stringify({execute:true,diagnosticOnly:true,fullOriginalWK1Shard:true,sourceFreezeSHA256:createHash('sha256').update(fs.readFileSync(file)).digest('hex'),authority:'Explicit reviewed workflow_dispatch, no official CI credit',actor:process.env.DIAGNOSTIC_ACTOR,run:process.env.DIAGNOSTIC_RUN,attempt:process.env.DIAGNOSTIC_ATTEMPT,ref:process.env.DIAGNOSTIC_REF},null,2),{mode:0o600});
          JS
      - name: Run the original full WK1 shard with passive Worker evidence
        env:
          RIGHELT_DIAGNOSTIC_CANDIDATE: ${{ github.workspace }}/candidate
          RIGHELT_DIAGNOSTIC_TOOLS: ${{ github.workspace }}/tools
          RIGHELT_DIAGNOSTIC_OUT: ${{ github.workspace }}/diagnostic-output
          RIGHELT_DIAGNOSTIC_GRANT: ${{ github.workspace }}/root-diagnostic-grant.json
        run: node diagnostic/scripts/diagnostics/pr250-worker-lifecycle/run.mjs
      - name: Preserve original cases, lifecycle records and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-worker-lifecycle-e497-diagnostic
          path: |
            diagnostic-output
            root-diagnostic-grant.json
          if-no-files-found: error
