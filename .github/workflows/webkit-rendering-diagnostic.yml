name: Firefox inline ownership diagnostic
on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Run reviewed original 2f2 full FF1 with an additive attachment reporter"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  diagnose:
    if: inputs.execute == true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout diagnostic source at dispatched branch
        uses: actions/checkout@v5
        with:
          path: diagnostic
          persist-credentials: false
      - name: Checkout original product separately
        uses: actions/checkout@v5
        with:
          ref: 2f2d7e12530004136dd64c5d8b958c8683166674
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout released supervisor
        uses: actions/checkout@v5
        with:
          ref: 0c7b51b64c26604f1e08939e827cb4a934aa4f93
          path: tools
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '9.15.9'
      - uses: actions/setup-node@v5
        with:
          node-version: '22.23.4'
          cache: pnpm
          cache-dependency-path: candidate/pnpm-lock.yaml
      - name: Install original frozen dependencies
        working-directory: candidate
        run: pnpm install --frozen-lockfile
      - name: Install original Firefox and Linux dependencies
        working-directory: candidate
        env:
          PROJECT: firefox
        run: node scripts/testing/install-browsers.mjs
      - name: Record original advisory selection
        working-directory: candidate
        run: pnpm test:plan --base origin/main
      - name: Record explicit diagnostic authority
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const file='diagnostic/scripts/diagnostics/pr251-ff1-ownership/source-freeze.json';
          fs.writeFileSync('root-diagnostic-grant.json',JSON.stringify({execute:true,diagnosticOnly:true,fullOriginalFF1Shard:true,sourceFreezeSHA256:createHash('sha256').update(fs.readFileSync(file)).digest('hex'),authority:'Explicit reviewed workflow_dispatch only, no official CI credit'},null,2),{mode:0o600});
          JS
      - name: Original full FF1 with additive inline persistence
        id: shard
        env:
          RIGHELT_DIAGNOSTIC_CANDIDATE: ${{ github.workspace }}/candidate
          RIGHELT_DIAGNOSTIC_TOOLS: ${{ github.workspace }}/tools
          RIGHELT_DIAGNOSTIC_OUT: ${{ github.workspace }}/diagnostic-output
          RIGHELT_DIAGNOSTIC_GRANT: ${{ github.workspace }}/root-diagnostic-grant.json
          RIGHELT_RESOURCE_REGISTRY: ${{ github.workspace }}/diagnostic-resources
          SUITE: e2e
          PROJECT: firefox
          SHARD: '1'
          SHARDS: '2'
        run: node tools/scripts/resources/cli.mjs run --kind heavy --timeout-ms 3540000 -- node diagnostic/scripts/diagnostics/pr251-ff1-ownership/run.mjs
      - name: Original mandatory post-shard storage validation
        if: always() && steps.shard.outputs.native_passed == 'true'
        working-directory: candidate
        env:
          PROJECT: firefox
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/storage-lifecycle/results.xml
          PLAYWRIGHT_OUTPUT_DIR: test-results/storage-lifecycle/artifacts
          RIGHELT_RESOURCE_REGISTRY: ${{ github.workspace }}/diagnostic-resources
        run: pnpm test:e2e:storage --project="$PROJECT"
      - name: Preserve original reports and exact inline bytes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: firefox-inline-ownership-2f2-diagnostic
          path: |
            diagnostic-output
            diagnostic-resources
            candidate/test-results/storage-lifecycle
            root-diagnostic-grant.json
          if-no-files-found: error
