name: Deploy
run-name: >-
  ${{
    github.event_name == 'workflow_run' &&
    format('Deploy: {0}', github.event.workflow_run.display_title) ||
    format('Deploy: {0}', github.ref_name)
  }}

on:
  workflow_dispatch:
    inputs:
      prepare_accounts:
        description: "Deploy during closed maintenance for first canary registration; do not reopen play"
        type: boolean
        default: false
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Preflight configuration check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_D1_DB_NAME: ${{ vars.CLOUDFLARE_D1_DB_NAME }}
          CLOUDFLARE_API_BASE_URL: ${{ vars.CLOUDFLARE_API_BASE_URL }}
          RIGHELT_AUTH_ENABLED: ${{ vars.RIGHELT_AUTH_ENABLED || 'false' }}
          RIGHELT_SITE_ORIGIN: ${{ vars.RIGHELT_SITE_ORIGIN }}
          AUTH_TURNSTILE_SITE_KEY: ${{ vars.AUTH_TURNSTILE_SITE_KEY }}
          AUTH_HMAC_SECRET: ${{ secrets.AUTH_HMAC_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          ACCOUNT_SMOKE_USERNAME: ${{ secrets.ACCOUNT_SMOKE_USERNAME }}
          ACCOUNT_SMOKE_PASSWORD: ${{ secrets.ACCOUNT_SMOKE_PASSWORD }}
          PREPARE_ACCOUNTS: ${{ inputs.prepare_accounts || 'false' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required variable: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "Missing required variable: CLOUDFLARE_PAGES_PROJECT"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_API_BASE_URL" ]; then
            echo "Missing required variable: CLOUDFLARE_API_BASE_URL"
            exit 1
          fi
          node scripts/deploy-account-services.mjs --check-only
          echo "Using D1 DB name: ${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}"

      - name: Wrangler version
        run: pnpm exec wrangler --version

      - name: Apply D1 migrations (dev db)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DB_NAME: ${{ vars.CLOUDFLARE_D1_DB_NAME }}
        run: |
          pnpm --dir apps/api exec wrangler d1 migrations apply "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" --config wrangler.toml --remote

      - name: Deploy private authentication services and API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          RIGHELT_AUTH_ENABLED: ${{ vars.RIGHELT_AUTH_ENABLED || 'false' }}
          RIGHELT_SITE_ORIGIN: ${{ vars.RIGHELT_SITE_ORIGIN }}
          AUTH_TURNSTILE_SITE_KEY: ${{ vars.AUTH_TURNSTILE_SITE_KEY }}
          AUTH_HMAC_SECRET: ${{ secrets.AUTH_HMAC_SECRET }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          ACCOUNT_SMOKE_USERNAME: ${{ secrets.ACCOUNT_SMOKE_USERNAME }}
          ACCOUNT_SMOKE_PASSWORD: ${{ secrets.ACCOUNT_SMOKE_PASSWORD }}
          PREPARE_ACCOUNTS: ${{ inputs.prepare_accounts || 'false' }}
        run: |
          node scripts/deploy-account-services.mjs

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "CLOUDFLARE_PAGES_PROJECT variable is required."
            exit 1
          fi
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > apps/web/deploy-meta.json <<EOF
          {
            "deployedAt": "${DEPLOYED_AT}",
            "commitSha": "${DEPLOY_SHA}"
          }
          EOF
          pnpm --dir apps/web exec wrangler pages deploy . --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main

      - name: Verify public Pages and private API boundaries
        env:
          RIGHELT_SITE_ORIGIN: ${{ vars.RIGHELT_SITE_ORIGIN }}
          CLOUDFLARE_API_BASE_URL: ${{ vars.CLOUDFLARE_API_BASE_URL }}
        run: node scripts/deploy-boundary-smoke.mjs

      - name: Verify acknowledged canary account
        if: vars.RIGHELT_AUTH_ENABLED == 'true' && !inputs.prepare_accounts
        env:
          RIGHELT_SITE_ORIGIN: ${{ vars.RIGHELT_SITE_ORIGIN }}
          ACCOUNT_SMOKE_USERNAME: ${{ secrets.ACCOUNT_SMOKE_USERNAME }}
          ACCOUNT_SMOKE_PASSWORD: ${{ secrets.ACCOUNT_SMOKE_PASSWORD }}
          ACCOUNT_SMOKE_LEGACY_GAME_ID: ${{ vars.ACCOUNT_SMOKE_LEGACY_GAME_ID }}
        run: node scripts/account-smoke.mjs

      - name: Verify account preparation remains closed
        if: inputs.prepare_accounts
        env:
          RIGHELT_SITE_ORIGIN: ${{ vars.RIGHELT_SITE_ORIGIN }}
          CLOUDFLARE_API_BASE_URL: ${{ vars.CLOUDFLARE_API_BASE_URL }}
        run: node scripts/deploy-boundary-smoke.mjs --preparation
