name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Preflight configuration check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_D1_DB_NAME: ${{ vars.CLOUDFLARE_D1_DB_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required variable: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "Missing required variable: CLOUDFLARE_PAGES_PROJECT"
            exit 1
          fi
          echo "Using D1 DB name: ${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}"

      - name: Wrangler version
        run: pnpm exec wrangler --version

      - name: Apply D1 migrations (dev db)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DB_NAME: ${{ vars.CLOUDFLARE_D1_DB_NAME }}
        run: |
          pnpm exec wrangler d1 migrations apply "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" --config apps/web/wrangler.toml --remote

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "CLOUDFLARE_PAGES_PROJECT variable is required."
            exit 1
          fi
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > apps/web/deploy-meta.json <<EOF
          {
            "deployedAt": "${DEPLOYED_AT}",
            "commitSha": "${GITHUB_SHA}"
          }
          EOF
          pnpm exec wrangler pages deploy apps/web --project-name "$CLOUDFLARE_PAGES_PROJECT"
