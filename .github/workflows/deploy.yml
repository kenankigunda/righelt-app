name: Deploy
run-name: >-
  ${{
    github.event_name == 'workflow_run' &&
    format('Deploy: {0}', github.event.workflow_run.display_title) ||
    format('Deploy: {0}', github.ref_name)
  }}

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: Dev
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Preflight configuration check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          CLOUDFLARE_D1_DB_NAME: ${{ vars.CLOUDFLARE_D1_DB_NAME }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Missing required secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Missing required variable: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "Missing required variable: CLOUDFLARE_PAGES_PROJECT"
            exit 1
          fi
          echo "Using D1 DB name: ${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}"

      - name: Wrangler version
        run: pnpm exec wrangler --version

      - name: Apply D1 migrations (dev db)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DB_NAME: ${{ vars.CLOUDFLARE_D1_DB_NAME }}
        run: |
          pnpm --dir apps/web exec wrangler d1 migrations apply "${CLOUDFLARE_D1_DB_NAME:-righelt-db-dev}" --config wrangler.toml --remote

      - name: Deploy game room Durable Object worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler deploy --config apps/game-room-worker/wrangler.toml

      - name: Deploy Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "CLOUDFLARE_PAGES_PROJECT variable is required."
            exit 1
          fi
          DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cat > apps/web/deploy-meta.json <<EOF
          {
            "deployedAt": "${DEPLOYED_AT}",
            "commitSha": "${DEPLOY_SHA}"
          }
          EOF
          pnpm --dir apps/web exec wrangler pages deploy . --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main

      - name: Smoke test deployed API bindings
        run: |
          HEALTH_URL="https://head.righelt.pages.dev/api/health"
          HEALTH_JSON="$(curl -fsS "$HEALTH_URL")"
          echo "$HEALTH_JSON"
          printf '%s' "$HEALTH_JSON" | node -e '
            let payload = "";
            process.stdin.on("data", (chunk) => {
              payload += chunk;
            });
            process.stdin.on("end", () => {
              const body = JSON.parse(payload);
              if (body?.ok !== true || body?.bindings?.db !== true || body?.bindings?.gameRooms !== true) {
                console.error("Deploy smoke test failed: required bindings are not active on head deployment.");
                process.exit(1);
              }
            });
          '
