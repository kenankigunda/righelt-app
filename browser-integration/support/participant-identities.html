<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/apps/web/styles.css"><link rel="stylesheet" href="/apps/web/shell/shell.css"><link rel="stylesheet" href="/apps/web/shell/refresh.css"><style>body{margin:0;padding:12px}main{max-width:600px;margin:auto}</style></head><body><main><section class="panel" id="participants"></section></main><script type="module">
import {createInlineProfiles} from '/apps/web/shell/public-profile.js';
import {renderPlayersPanel,renderViewersPanel} from '/apps/web/shell/players-panel.js';
import {renderConnectionStatusIcon} from '/apps/web/shell/participant-status.js';
import {icon} from '/apps/web/shell/ui.js';
import {ensureHoverCapabilityController} from '/apps/web/hover-capability.js';
const render=(game,identityId='human')=>{const options={identityId,expanded:true,computerActivity:{state:'here',label:'Active here',activeHere:true,showResume:false},icon,formatStatus:connected=>renderConnectionStatusIcon(connected?'connected':'disconnected',connected?'Connected':'Disconnected')};return renderPlayersPanel(game,options)+renderViewersPanel(game,options);};
const profiles=createInlineProfiles({fetcher:async()=>({ok:true,json:async()=>({joinedMonth:'2026-01'})})});
window.renderPlayers=(computerSide='p2',profile='horus',humanName='Alice',identityId='human')=>{const human={identityId:'human',profile:{username:'alice',displayName:humanName},connected:true},computer={identityId:'human',computerProfile:profile,profile:human.profile,connected:false};document.querySelector('#participants').innerHTML=render({id:'game',myRole:computerSide==='p1'?'Player 2':'Player 1',player1:computerSide==='p1'?computer:human,player2:computerSide==='p2'?computer:human,viewers:[{identityId:'guest',connected:false}]},identityId);profiles.sync();};
window.renderSelfPlay=()=>{const human={identityId:'human',profile:{username:'alice',displayName:'Alice'},connected:true};document.querySelector('#participants').innerHTML=render({id:'self',myRole:'Both Players',myRoles:['Both Players'],selfPlayMode:true,player1:human,player2:{...human},viewers:[]},'human');profiles.sync();};
document.addEventListener('click',event=>{const button=event.target.closest('[data-profile-key]');if(button)void profiles.open(button.dataset.username,button);});
ensureHoverCapabilityController(document);window.renderPlayers();await document.fonts.ready;window.fixtureReady=true;
</script></body></html>
