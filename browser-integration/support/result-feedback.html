<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result feedback</title><link rel="stylesheet" href="/apps/web/styles.css"><link rel="stylesheet" href="/apps/web/shell/shell.css"><link rel="stylesheet" href="/apps/web/shell/refresh.css"><style>body{padding:16px}#app{max-width:700px;margin:auto;padding:0}.game-result{margin:0}.result-test-controls{display:flex;gap:8px;margin-bottom:16px}</style></head><body><main id="app"><div class="result-test-controls"><button id="finish">Finish live game</button><button id="review">Review history</button></div><div id="result"></div></main><script type="module">
import{createModal}from'/apps/web/shell/modal.js';
import{icon}from'/apps/web/shell/ui.js';
import{getGameResult,createResultTransitions,createRematchDialog}from'/apps/web/shell/game-result.js';
import{renderResultMark,createResultPresentation}from'/apps/web/shell/result-presentation.js';
const rematch=createRematchDialog({createModal,onStart:async()=>{}});
const tracker=createResultTransitions(),presentation=createResultPresentation();let identity='red';let game;
const position=status=>({pieces:status==='draw'?[]:status==='p2_win'?[{id:'C2',supplied:true}]:[{id:'C1',supplied:true}],outcome:{status,reason:status==='draw'?'both_commanders_destroyed':status==='p2_win'?'p1_commander_destroyed':'p2_commander_destroyed'}});
const paint=()=>{const result=getGameResult(game,identity);document.querySelector('#result').innerHTML=result?`<section class="panel game-result" data-result-tone="${result.tone}" data-winner="${result.winner??''}"><p class="small">Game finished</p>${renderResultMark(result)}<h1 tabindex="-1">${result.title}</h1><p>${result.reason}</p><div class="story-modal-actions"><button id="review-result" data-action="analysis">${icon('back')}Review game</button><button${result.tone==='victory'?'':' class="secondary"'} data-action="rematch">${icon('rematch')}Play again</button><a class="button-link secondary" href="#home">${icon('home')}Home</a></div></section>`:'';presentation.mount(document.querySelector('.game-result'),'g');document.querySelector('[data-action="rematch"]')?.addEventListener('click',event=>rematch.open(getGameResult(game,identity),event.currentTarget));};
window.resultFixture={setup(side='red',status='ongoing',inHistory=false){tracker.clear();presentation.clear();identity=side;game={id:'g',player1:{identityId:'red'},player2:{identityId:'blue'},board:{state:position(status)}};tracker.observe(game,{inHistory});paint();},finish(inHistory=false,status='p1_win'){Object.assign(game.board.state,position(status));if(tracker.observe(game,{inHistory}))presentation.enter('g',getGameResult(game,identity));paint();},repaint:paint,clear:()=>presentation.clear()};
document.querySelector('#finish').onclick=()=>window.resultFixture.finish();document.querySelector('#review').onclick=()=>{presentation.clear();document.querySelector('#result').innerHTML='History preview';};
window.resultFixture.setup();window.fixtureReady=true;
</script></body></html>
