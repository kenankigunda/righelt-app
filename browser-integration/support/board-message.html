<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Board message touch targets</title>
<link rel="stylesheet" href="/apps/web/styles.css"><link rel="stylesheet" href="/apps/web/shell/shell.css"><link rel="stylesheet" href="/apps/web/shell/refresh.css"><link rel="stylesheet" href="/apps/web/shell/board-ux.css"><link rel="stylesheet" href="/apps/web/shell/loading.css">
<style>body{margin:0;padding:0}#app{max-width:100%}main{width:min(100%,560px);margin:auto}main > .board-heading-slot > .board-heading{margin-block-start:0;padding-block-start:.83em}.board-wrap{padding-bottom:0!important}.board{width:100%}#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#fixture-context{position:fixed;left:12px;right:12px;bottom:12px;max-width:560px;z-index:20;pointer-events:none}#fixture-context .board-context-notice{pointer-events:auto}</style></head>
<body><div id="app" class="app-root" data-shell-route="game" data-shell-layout-mode="narrow"><main data-shell-panel="board"><h2>Player 1 to play</h2><div id="message-slot"></div><div class="board-wrap"><div id="board" class="board"></div><svg id="lines"></svg></div></main><aside id="fixture-context" aria-label="Controlled Board context fixture"></aside></div><script type="module">
import {currentScalePublication} from './fixture-publication.mjs';
import {measurePatternUsedMinimum} from './pattern-used-minimum.mjs';
window.measurePatternUsedMinimum=measurePatternUsedMinimum;
import {renderBoardMessageSlot,updateComputerBoardLoading} from "/apps/web/shell/board-message-layout.js";
document.querySelector("#message-slot").outerHTML=renderBoardMessageSlot({id:"preview"});
import {mountLoadingFeedback} from "/apps/web/shell/loading.js";
mountLoadingFeedback(document);
window.updateComputerBoardLoading=updateComputerBoardLoading;
window.fixturePublicationFor=node=>{const lookup=()=>document.querySelector('#preview')?.closest('.board-message-slot');const result=node===lookup()?currentScalePublication(lookup,{used:true}):{ready:false,incomplete:true,reason:'stale-current-slot'};window.fixturePublicationLast=result;return result;};
await import("/browser-integration/support/board.mjs");
</script></body></html>
