<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Message font admission</title>
<script>document.documentElement.style.fontSize=new URLSearchParams(location.search).get('scale')==='200'?'200%':'100%';</script>
<link rel="stylesheet" href="/apps/web/styles.css"><link rel="stylesheet" href="/apps/web/shell/shell.css"><link rel="stylesheet" href="/apps/web/shell/refresh.css"><link rel="stylesheet" href="/apps/web/shell/board-ux.css">
</head><body><main id="app" class="app-root" data-shell-route="game"><div class="shell-main-content"></div></main>
<script type="module">
import {renderBoardMessageSlot,renderBoardHeadingSlot} from '/apps/web/shell/board-message-layout.js';
import {renderSummaryLoading,renderPlayersLoading,renderHistoryLoading} from '/apps/web/shell/panel-loading.js';
import {icon} from '/apps/web/icons.js';
const app=document.querySelector('#app'),source=await(await fetch('/apps/web/shell/app.js')).text();
const start=source.indexOf('const renderGameShellFrame ='),end=source.indexOf('const getMountedGameShellRoot =',start);
if(start<0||end<=start)throw Error('Actual shell frame missing');
const board=()=>`${renderBoardHeadingSlot({loading:true})}${renderBoardMessageSlot({id:'font-message',loading:true})}<div class="board-wrap"><div class="board loading-board-silhouette" id="font-board">${'<div class="cell"></div>'.repeat(100)}</div></div>`;
const frame=Function('escapeHtml','formatDisplayGameId','renderSummaryLoading','renderPlayersLoading','renderHistoryLoading','renderBoardLoadingPreview','renderBoardPanel','renderGameShellPanelTab',`${source.slice(start,end)};return renderGameShellFrame;`)(String,String,renderSummaryLoading,renderPlayersLoading,renderHistoryLoading,board,board,()=> '');
app.querySelector('.shell-main-content').innerHTML=frame({id:'font-admission'},{loading:true});
const layout=()=>{const narrow=innerWidth<933;app.dataset.shellLayoutMode=narrow?'narrow':'wide';app.style.setProperty('--shell-game-panel-index','1');app.querySelectorAll('[data-mobile-panel]').forEach(node=>node.toggleAttribute('inert',narrow&&node.dataset.mobilePanel!=='board'));};
layout();window.addEventListener('resize',layout);
window.fontAnchors=()=>{const rect=selector=>document.querySelector(selector).getBoundingClientRect().toJSON();const panel=document.querySelector('[data-shell-panel="board"]'),style=getComputedStyle(panel);return {availableInlineSize:panel.getBoundingClientRect().width-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-parseFloat(style.borderLeftWidth)-parseFloat(style.borderRightWidth),slot:rect('.board-message-slot'),board:rect('#font-board'),panel:rect('[data-shell-panel="board"]'),fontStatus:document.fonts.status,fallback:getComputedStyle(document.querySelector('[data-sizing-font="fallback"]')).fontFamily,primary:getComputedStyle(document.querySelector('[data-sizing-font="primary"]')).fontFamily};};
window.fontEnvelope=width=>{
 const slot=document.querySelector('.board-message-slot'),probe=document.createElement('div');probe.className='board-message-slot';
 probe.setAttribute('aria-hidden','true');probe.setAttribute('inert','');probe.style.cssText=`position:absolute;left:-10000px;top:0;inline-size:${width??slot.getBoundingClientRect().width}px;visibility:hidden;pointer-events:none`;
 document.body.append(probe);
 const rows=[...slot.querySelectorAll('.board-message-sizing')].map(node=>{const copy=node.cloneNode(true);copy.style.cssText='display:block;height:auto;align-self:start;margin:0';probe.append(copy);return {font:node.dataset.sizingFont,variant:node.dataset.sizingVariant,text:node.textContent,height:copy.getBoundingClientRect().height,lineHeight:parseFloat(getComputedStyle(copy).lineHeight),minHeight:parseFloat(getComputedStyle(copy).minHeight)};});
 probe.remove();return {width:width??slot.getBoundingClientRect().width,primary:Math.max(...rows.filter(row=>row.font==='primary').map(row=>row.height)),fallback:Math.max(...rows.filter(row=>row.font==='fallback').map(row=>row.height)),rows};
};
window.admitMessagePhases=()=>{
 const slot=document.querySelector('.board-message-slot'),live=slot.querySelector('#font-message'),before=window.fontAnchors(),failures=[];
 for(const paragraph of slot.querySelectorAll('[data-sizing-font="primary"]')){
  live.innerHTML=paragraph.innerHTML;
  const envelope=window.fontAnchors();
  const probe=document.createElement('div');probe.className='board-message-slot';probe.style.cssText=`position:absolute;left:-10000px;inline-size:${before.slot.width}px;height:auto;margin:0`;probe.innerHTML=`<p class="board-preview-label" style="height:auto;align-self:start;margin:0">${live.innerHTML}</p>`;document.body.append(probe);
  if(probe.getBoundingClientRect().height>before.slot.height+.1||envelope.board.top!==before.board.top||envelope.slot.height!==before.slot.height)failures.push({variant:paragraph.dataset.sizingVariant,text:paragraph.textContent,height:probe.getBoundingClientRect().height,reserved:before.slot.height});
  probe.remove();
 }
 live.innerHTML=`Select a piece <button class="board-preview-inline-button">${icon('right')}<span class="board-inline-action-label">Pass</span></button>`;
 return failures;
};
window.fixtureReady=true;
</script></body></html>
