project_name: "Righelt"
default_status: "To Do"
statuses: ["To Do", "Spec", "Planning", "Ready for execution", "In Progress", "Blocked", "Review", "Ready for acceptance", "Done"]
labels: ["feature", "improvement", "bug"]
date_format: yyyy-mm-dd
max_column_width: 20
default_editor: "code -w"
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
zero_padded_ids: 3
bypass_git_hooks: true
check_active_branches: true
active_branch_days: 10
task_prefix: "t"
