name = "righelt-auth"
main = "index.mjs"
compatibility_date = "2026-03-12"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[services]]
binding = "HASH_ENGINE"
service = "righelt-auth-hash"

[[durable_objects.bindings]]
name = "PASSWORD_ADMISSION"
class_name = "PasswordAdmissionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PasswordAdmissionDO"]
